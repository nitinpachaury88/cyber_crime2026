<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Choose a Case — CyberTrace</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="bg3d"></div>
  <div class="bg-scan"></div>
  <div class="bg-vignette"></div>

  <div class="app" style="max-width:1100px; margin:0 auto; padding:24px;">
    <div class="topbar">
      <div>
        <h2 class="display" id="teamName">Loading…</h2>
        <p style="margin:0" id="teamSub"></p>
      </div>
      <div style="display:flex; gap:10px; align-items:center;">
        <a class="btn btn-sm" href="/leaderboard.html">🏆 Leaderboard</a>
        <div class="nav-link" id="logoutBtn" style="border:1px solid var(--border); border-radius:var(--radius-sm); padding:8px 14px;">⎋ Log Out</div>
      </div>
    </div>

    <div id="flashHost"></div>

    <div class="card team-header-card" id="rosterCard" style="margin-bottom:22px;">
      <div>
        <div class="card-title" style="margin-bottom:8px;">Team Roster</div>
        <div id="memberChips"></div>
      </div>
      <div id="addMemberBox"></div>
    </div>

    <h3 style="margin-bottom:4px;">Your Assessment</h3>
    <p style="margin-top:0;">Three cases, 8-option multiple choice questions, one combined score out of 100. Work through all three, then submit once from the assessment page.</p>
    <div class="case-grid" id="caseGrid"></div>
    <div id="assessmentCta" style="margin-top:18px; max-width:320px;"></div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="/js/bg3d.js"></script>
<script src="/js/api.js"></script>
<script src="/js/cases.js"></script>
</body>
</html>
